[package]
name = "voidpad"
version = "1.0.0"
description = "A premium, completely offline Notion clone"
authors = ["VoidPad"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "3.3.1"
gray_matter = "0.2.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
